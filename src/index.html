<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Validator</title>
</head>
<body>
    <div class="container">
        <h1>Проверка номера карты</h1>
        <div class="cards-icons"></div>
        <div class="input-group">
            <input type="text" id="cardNumber" placeholder="Введите номер карты" autocomplete="off">
            <button id="validateBtn">Проверить</button>
        </div>
        <div id="result" class="result"></div>
    </div>
</body>
</html>
